<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10303a"><meta name="apple-mobile-web-app-title" content="Clínica"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Clínica Controle</title>
<style>
/* Layout: tablet em paisagem, barra lateral fixa + área de trabalho; no celular a barra vira rodapé */
:root{--bg:#f3f6f8;--surface:#fff;--fg:#14232b;--muted:#5d6f78;--line:#dbe3e8;--accent:#0b7a75;--accent-fg:#fff;--accent-soft:#dcf1ef;--ok:#1b7f45;--ok-soft:#dff3e6;--warn:#a65b00;--warn-soft:#fdeccd;--bad:#b3261e;--bad-soft:#fadbd8;--side:#10303a;--side-fg:#d6e6ea;
--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--display:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a20;--surface:#15262e;--fg:#e6f0f3;--muted:#92a8b1;--line:#27404b;--accent:#35b8b0;--accent-fg:#06201f;--accent-soft:#12403f;--ok:#58c487;--ok-soft:#133a25;--warn:#f0b04c;--warn-soft:#3d2b0a;--bad:#f2837c;--bad-soft:#431a17;--side:#0a1419;--side-fg:#b9cdd3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a20;--surface:#15262e;--fg:#e6f0f3;--muted:#92a8b1;--line:#27404b;--accent:#35b8b0;--accent-fg:#06201f;--accent-soft:#12403f;--ok:#58c487;--ok-soft:#133a25;--warn:#f0b04c;--warn-soft:#3d2b0a;--bad:#f2837c;--bad-soft:#431a17;--side:#0a1419;--side-fg:#b9cdd3;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--side);color:var(--side-fg);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
nav.side h1{font:700 17px var(--display);color:#fff;margin:2px 8px 14px;line-height:1.2}
nav.side h1 small{display:block;font:500 12px var(--font);color:var(--side-fg);opacity:.8;margin-top:2px}
nav.side button{all:unset;cursor:pointer;padding:13px 14px;border-radius:10px;font-weight:700;font-size:15px}
nav.side button[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
nav.side button:focus-visible{outline:2px solid #fff}
.sync{margin-top:auto;font-size:12px;padding:8px;opacity:.85}
main{padding:22px max(16px,env(safe-area-inset-right,0px)) 40px 24px;min-width:0}
h2{font:700 24px var(--display);margin:0 0 4px}
h3{font:700 16px var(--display);margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi .n{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pos{color:var(--ok)}.neg{color:var(--bad)}
button,.btn{font:700 15px var(--font);min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.wa,.btn.wa{background:#1f9d55;color:#fff;border-color:#1f9d55}
button.danger{color:var(--bad)}
button.sm,.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:500 16px var(--font);min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form .full{grid-column:1/-1}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(5,15,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal .card{width:min(680px,100%)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.day{min-width:78px;text-align:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.day b{display:block;font:700 20px var(--display)}.day span{font-size:12px;color:var(--muted);text-transform:uppercase}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.day[aria-pressed="true"] span{color:var(--accent-fg)}
.day i{display:block;font-size:11px;font-style:normal;min-height:14px}
.appt{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.appt .h{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.arch{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.tooth{min-height:54px;padding:0;flex-direction:column;justify-content:center;gap:0;font-size:13px;border-radius:8px}
.tooth small{font-size:10px;font-weight:500;color:var(--muted)}
.tooth.done{background:var(--ok-soft);border-color:var(--ok)}
.tooth.plan{background:var(--warn-soft);border-color:var(--warn)}
.tooth[aria-pressed="true"]{outline:3px solid var(--accent)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:8px 0 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;z-index:60}
.stack{display:grid;gap:14px}
@media (max-width:760px){
.app{grid-template-columns:1fr}
nav.side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;overflow-x:auto}
nav.side h1,.sync{display:none}
nav.side button{padding:10px 12px;white-space:nowrap;font-size:14px}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
.arch{grid-template-columns:repeat(8,minmax(0,1fr))}
.appt{grid-template-columns:56px 1fr}.appt .acts{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.modal .card{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.4}}}
</style></head><body>
<div class="app">
<nav class="side" id="nav"></nav>
<main id="main"><div class="empty">Carregando…</div></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad=n=>String(n).padStart(2,"0");
const hoje=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fdata=s=>{if(!s)return"";const[a,m,d]=s.split("-");return `${d}/${m}/${a}`};
const dsem=s=>["dom","seg","ter","qua","qui","sex","sáb"][new Date(s+"T12:00:00").getDay()];
const dsemLonga=s=>["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"][new Date(s+"T12:00:00").getDay()];
const addDias=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const cfg=()=>(S.config||[]).find(c=>c.id==="clinica")||{};

const S={view:"inicio",pacientes:[],consultas:[],tratamentos:[],orcamentos:[],lancamentos:[],documentos:[],imagens:[],config:[],
  dia:hoje(),mes:hoje().slice(0,7),pacId:null,aba:"dentes",dente:null,busca:"",ok:false,erro:""};
let db=null;

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function modal(html){$("#modal").innerHTML=html?`<div class="modal" data-act="fechar-bg"><div class="card" role="dialog" aria-modal="true">${html}</div></div>`:""}
const pac=id=>S.pacientes.find(p=>p.id===id);
const nomePac=id=>pac(id)?.nome||"(paciente removido)";

/* WhatsApp: abre a conversa com o texto pronto; o envio final é o toque em "Enviar" no WhatsApp */
function waLink(tel,texto){let n=String(tel||"").replace(/\D/g,"");if(n.length<=11)n="55"+n;return `https://wa.me/${n}?text=${encodeURIComponent(texto)}`}
const assin=()=>cfg().nome?`\n\n${cfg().nome}`:"";
function msgConsulta(c){const p=pac(c.pacienteId);return `Olá, ${(p?.nome||"").split(" ")[0]}! Lembrando da sua consulta${c.procedimento?` (${c.procedimento})`:""} no dia ${fdata(c.data)} (${dsemLonga(c.data)}) às ${c.hora}. Pode confirmar sua presença?${assin()}`}
function totalOrc(o){return Math.max(0,(o.itens||[]).reduce((s,i)=>s+(Number(i.valor)||0),0)-(Number(o.desconto)||0))}
function msgOrc(o){const p=pac(o.pacienteId);const l=(o.itens||[]).map(i=>`• ${i.dente&&i.dente!=="geral"?`Dente ${i.dente} – `:""}${i.desc}: ${brl(i.valor)}`).join("\n");
  return `Olá, ${(p?.nome||"").split(" ")[0]}! Segue o orçamento do seu tratamento:\n\n${l}\n${o.desconto?`\nDesconto: ${brl(o.desconto)}`:""}\n*Total: ${brl(totalOrc(o))}*${o.obs?`\n\n${o.obs}`:""}\n\nQualquer dúvida estou à disposição.${assin()}`}
function msgCobr(l){const p=pac(l.pacienteId);return `Olá, ${(p?.nome||"").split(" ")[0]}! Passando para lembrar do pagamento de ${brl(l.valor)} referente a "${l.desc}"${l.vencimento?`, com vencimento em ${fdata(l.vencimento)}`:""}. Se já pagou, desconsidere. Obrigado!${assin()}`}
const btnWa=(tel,txt,rot="Enviar WhatsApp")=>tel?`<a class="btn wa sm" target="_blank" rel="noopener" href="${esc(waLink(tel,txt))}">${rot}</a>`:`<span class="pill warn">sem telefone</span>`;

const MENU=[["inicio","Início"],["agenda","Agenda"],["pacientes","Pacientes"],["orcamentos","Orçamentos"],["financeiro","Financeiro"],["relatorio","Relatórios"],["config","Ajustes"]];
function renderNav(){$("#nav").innerHTML=`<h1>${esc(cfg().nome||"Minha clínica")}<small>Controle odontológico</small></h1>`+
  MENU.map(([k,t])=>`<button data-act="ir" data-v="${k}" aria-current="${S.view===k||(S.view==="paciente"&&k==="pacientes")}">${t}</button>`).join("")+
  `<div class="sync">${S.erro?esc(S.erro):S.ok?"Dados salvos neste aparelho":"Conectando…"}</div>`}

const COLS_CACHE=["pacientes","consultas","tratamentos","orcamentos","lancamentos","documentos","imagens","config"];
async function salvar(col,id,dados){if(!db){toast("Banco de dados indisponível");return null}
  try{const ref=id?db.collection(col).doc(id):db.collection(col).doc();await ref.set({...dados,atualizado:Date.now()});return ref.id}
  catch(e){toast("Não foi possível salvar: "+(e.message||e.code));return null}}
async function remover(col,id){try{await db.collection(col).doc(id).delete();if(col==="imagens")await db.blobDel(id)}catch(e){toast("Não foi possível remover")}}
function ouvir(col){db.collection(col).onSnapshot(s=>{S[col]=s.docs.map(d=>({id:d.id,...d.data()}));S.ok=true;render()},
  e=>{S.erro="Erro ao ler os dados";render()})}

function render(){renderNav();const v=VIEWS[S.view]||VIEWS.inicio;$("#main").innerHTML=v()}
</script>
<script>
/* Banco de dados local (IndexedDB): tudo fica guardado neste aparelho */
const STORES=["pacientes","consultas","tratamentos","orcamentos","lancamentos","documentos","imagens","config","imgdados"];
const novoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function criarLocalDB(){return new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(new Error("sem indexedDB"));return}
  const rq=indexedDB.open("clinica_controle",1);
  rq.onupgradeneeded=()=>{STORES.forEach(s=>{if(!rq.result.objectStoreNames.contains(s))rq.result.createObjectStore(s,{keyPath:"id"})})};
  rq.onerror=()=>reject(rq.error);
  rq.onsuccess=async()=>{
    const idb=rq.result,cache={},subs={};
    COLS_CACHE.forEach(c=>{cache[c]=new Map();subs[c]=[]});
    const tx=(s,m="readonly")=>idb.transaction(s,m).objectStore(s);
    const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const fim=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
    try{for(const c of COLS_CACHE){(await req(tx(c).getAll())).forEach(o=>cache[c].set(o.id,o))}}catch(e){reject(e);return}
    const emit=c=>{const docs=[...cache[c].values()].map(o=>{const{id,...rest}=o;return{id,data:()=>rest}});subs[c].forEach(f=>f({docs}))};
    const put=async(s,o)=>{const t=idb.transaction(s,"readwrite");t.objectStore(s).put(o);await fim(t)};
    const del=async(s,id)=>{const t=idb.transaction(s,"readwrite");t.objectStore(s).delete(id);await fim(t)};
    resolve({
      collection:c=>({
        doc:id=>{id=id||novoId();return{id,set:async d=>{const o={...d,id};await put(c,o);cache[c].set(id,o);emit(c)},delete:async()=>{await del(c,id);cache[c].delete(id);emit(c)}}},
        onSnapshot:f=>{subs[c].push(f);emit(c)}}),
      blobPut:(id,dataUrl)=>put("imgdados",{id,dataUrl}),
      blobGet:async id=>{const o=await req(tx("imgdados").get(id));return o?o.dataUrl:null},
      blobDel:id=>del("imgdados",id),
      exportar:async()=>{const data={};for(const s of STORES)data[s]=await req(tx(s).getAll());return{app:"clinica-controle",versao:1,gerado:new Date().toISOString(),data}},
      importar:async obj=>{for(const s of STORES){const t=idb.transaction(s,"readwrite");const st=t.objectStore(s);st.clear();(obj.data[s]||[]).forEach(o=>st.put(o));await fim(t)}
        for(const c of COLS_CACHE){cache[c]=new Map((obj.data[c]||[]).map(o=>[o.id,o]));emit(c)}}
    });
  }})}
</script>
<script>
const STC={agendada:["Agendada",""],confirmada:["Confirmada","ok"],realizada:["Realizada","ok"],faltou:["Faltou","bad"],cancelada:["Cancelada","bad"]};
const pill=(st)=>{const[t,c]=STC[st]||[st,""];return `<span class="pill ${c}">${t}</span>`};
const consultasDia=d=>S.consultas.filter(c=>c.data===d).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
const pendentes=()=>S.lancamentos.filter(l=>l.tipo==="entrada"&&l.status==="pendente");
const somaMes=(tipo,mes)=>S.lancamentos.filter(l=>l.tipo===tipo&&l.status==="pago"&&(l.data||"").startsWith(mes)).reduce((s,l)=>s+(+l.valor||0),0);

function apptRow(c){const p=pac(c.pacienteId);return `<div class="appt"><div class="h">${esc(c.hora)}</div>
<div><b>${esc(p?.nome||"(paciente removido)")}</b><br><span class="sub" style="margin:0">${esc(c.procedimento||"Consulta")} · ${c.duracao||30} min</span> ${pill(c.status)}</div>
<div class="acts">${btnWa(p?.tel,msgConsulta(c),"Avisar")}
<button class="sm" data-act="consulta-form" data-id="${c.id}">Editar</button></div></div>`}

function vInicio(){const h=hoje(),cs=consultasDia(h),pend=pendentes(),totPend=pend.reduce((s,l)=>s+(+l.valor||0),0);
  const ent=somaMes("entrada",h.slice(0,7)),sai=somaMes("saida",h.slice(0,7));
  return `<h2>Hoje, ${fdata(h)}</h2><p class="sub">${dsemLonga(h)}</p>
<div class="grid" style="margin-bottom:18px">
<div class="card kpi"><div class="l">Consultas hoje</div><div class="n">${cs.length}</div></div>
<div class="card kpi"><div class="l">Entradas no mês</div><div class="n pos">${brl(ent)}</div></div>
<div class="card kpi"><div class="l">Saídas no mês</div><div class="n neg">${brl(sai)}</div></div>
<div class="card kpi"><div class="l">A receber</div><div class="n">${brl(totPend)}</div><div class="sub" style="margin:0">${pend.length} cobrança(s) em aberto</div></div></div>
<div class="card"><div class="bar"><h3 class="grow" style="margin:0">Agenda de hoje</h3><button class="primary" data-act="consulta-form" data-data="${h}">+ Nova consulta</button></div>
${cs.length?cs.map(apptRow).join(""):`<div class="empty">Nenhuma consulta marcada para hoje.</div>`}</div>`}

function vAgenda(){const dias=[];for(let i=-1;i<13;i++)dias.push(addDias(hoje(),i));
  const cs=consultasDia(S.dia);
  return `<div class="bar"><div class="grow"><h2>Agenda</h2><p class="sub" style="margin:0">${dsemLonga(S.dia)}, ${fdata(S.dia)}</p></div>
<input type="date" id="diaSel" value="${S.dia}" style="width:auto" data-act="dia-input"><button class="primary" data-act="consulta-form" data-data="${S.dia}">+ Nova consulta</button></div>
<div class="days">${dias.map(d=>{const n=consultasDia(d).length;return `<button class="day" data-act="dia" data-d="${d}" aria-pressed="${d===S.dia}"><span>${dsem(d)}</span><b>${d.slice(8)}</b><i>${n?n+" consulta"+(n>1?"s":""):""}</i></button>`}).join("")}</div>
<div class="card">${cs.length?cs.map(apptRow).join(""):`<div class="empty">Dia livre. Toque em "Nova consulta" para marcar.</div>`}</div>`}

function consultaForm(id,data){const c=S.consultas.find(x=>x.id===id)||{data:data||S.dia,hora:"09:00",duracao:30,status:"agendada",pacienteId:S.pacId||""};
  if(!S.pacientes.length){modal(`<h3>Cadastre um paciente primeiro</h3><p>Para marcar uma consulta é preciso ter ao menos um paciente.</p><div class="acts"><button class="primary" data-act="paciente-form">Cadastrar paciente</button><button data-act="fechar">Fechar</button></div>`);return}
  modal(`<h3>${id?"Editar consulta":"Nova consulta"}</h3><form id="f" class="form" data-id="${id||""}" data-kind="consulta">
<label class="full">Paciente<select name="pacienteId" required>${S.pacientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}" ${p.id===c.pacienteId?"selected":""}>${esc(p.nome)}</option>`).join("")}</select></label>
<label>Data<input type="date" name="data" value="${c.data}" required></label>
<label>Hora<input type="time" name="hora" value="${c.hora}" required></label>
<label>Duração (min)<input type="number" name="duracao" min="10" step="5" value="${c.duracao||30}"></label>
<label>Situação<select name="status">${Object.keys(STC).map(k=>`<option value="${k}" ${k===c.status?"selected":""}>${STC[k][0]}</option>`).join("")}</select></label>
<label class="full">Procedimento<input name="procedimento" value="${esc(c.procedimento||"")}" placeholder="Ex.: Restauração dente 36, Limpeza, Avaliação"></label>
<div class="full acts"><button class="primary" type="submit">Salvar</button><button type="button" data-act="fechar">Cancelar</button>${id?`<button type="button" class="danger" data-act="del" data-col="consultas" data-id="${id}">Excluir</button>`:""}</div></form>`)}

function pacienteForm(id){const p=pac(id)||{};
  modal(`<h3>${id?"Editar paciente":"Novo paciente"}</h3><form id="f" class="form" data-id="${id||""}" data-kind="paciente">
<label class="full">Nome completo<input name="nome" value="${esc(p.nome||"")}" required></label>
<label>WhatsApp (com DDD)<input name="tel" inputmode="tel" value="${esc(p.tel||"")}" placeholder="24 99999-0000"></label>
<label>Nascimento<input type="date" name="nasc" value="${p.nasc||""}"></label>
<label class="full">Observações<textarea name="obs" rows="3">${esc(p.obs||"")}</textarea></label>
<div class="full acts"><button class="primary" type="submit">Salvar</button><button type="button" data-act="fechar">Cancelar</button></div></form>`)}

function vPacientes(){const q=S.busca.toLowerCase();const l=S.pacientes.filter(p=>!q||p.nome.toLowerCase().includes(q)||(p.tel||"").includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<div class="bar"><div class="grow"><h2>Pacientes</h2><p class="sub" style="margin:0">${S.pacientes.length} cadastrado(s)</p></div>
<input id="busca" placeholder="Buscar por nome ou telefone" value="${esc(S.busca)}" style="max-width:280px"><button class="primary" data-act="paciente-form">+ Novo paciente</button></div>
<div class="card tbl">${l.length?`<table><thead><tr><th>Nome</th><th>WhatsApp</th><th class="r">Tratamentos</th><th></th></tr></thead><tbody>${l.map(p=>`<tr><td><b>${esc(p.nome)}</b></td><td>${esc(p.tel||"—")}</td><td class="r">${S.tratamentos.filter(t=>t.pacienteId===p.id).length}</td><td class="r"><button class="sm" data-act="abrir-pac" data-id="${p.id}">Abrir ficha</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">Nenhum paciente encontrado. Toque em "Novo paciente" para começar.</div>`}</div>`}
</script>
<script>
const SUP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],INF=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const DENTES=[...SUP,...INF];
const dOpt=(sel)=>`<option value="geral" ${sel==="geral"?"selected":""}>Geral / sem dente</option>`+DENTES.map(d=>`<option value="${d}" ${String(sel)===String(d)?"selected":""}>Dente ${d}</option>`).join("");
const tratDente=(pid,d)=>S.tratamentos.filter(t=>t.pacienteId===pid&&String(t.dente)===String(d));
function toothBtn(pid,d){const ts=tratDente(pid,d);const cls=ts.some(t=>t.status==="realizado")?"done":ts.length?"plan":"";
  return `<button class="tooth ${cls}" data-act="dente" data-d="${d}" aria-pressed="${String(S.dente)===String(d)}" aria-label="Dente ${d}, ${ts.length} procedimento(s)">${d}<small>${ts.length||"·"}</small></button>`}

function vPaciente(){const p=pac(S.pacId);if(!p){S.view="pacientes";return vPacientes()}
  const ts=S.tratamentos.filter(t=>t.pacienteId===p.id).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const aba=S.aba;
  const tab=(k,t)=>`<button data-act="aba" data-k="${k}" aria-pressed="${aba===k}">${t}</button>`;
  let corpo="";
  if(aba==="dentes"){
    const sel=S.dente?tratDente(p.id,S.dente):null;
    corpo=`<div class="card"><h3>Odontograma</h3><div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Realizado</span><span><i style="background:var(--warn-soft);border-color:var(--warn)"></i>Planejado</span><span>Número pequeno = procedimentos no dente</span></div>
<div class="arch" style="margin-bottom:8px">${SUP.map(d=>toothBtn(p.id,d)).join("")}</div><div class="arch">${INF.map(d=>toothBtn(p.id,d)).join("")}</div></div>
${S.dente?`<div class="card" style="margin-top:14px"><div class="bar"><h3 class="grow" style="margin:0">Dente ${esc(S.dente)}</h3><button class="primary sm" data-act="trat-form" data-dente="${esc(S.dente)}">+ Procedimento neste dente</button></div>${sel.length?tratTabela(sel):`<div class="empty">Nenhum procedimento registrado neste dente.</div>`}</div>`:`<p class="sub" style="margin-top:12px">Toque em um dente para ver o histórico ou registrar um procedimento.</p>`}`;
  }else if(aba==="hist"){
    corpo=`<div class="card"><div class="bar"><h3 class="grow" style="margin:0">Histórico de tratamentos</h3><button class="primary sm" data-act="trat-form">+ Registrar</button></div>${ts.length?tratTabela(ts,true):`<div class="empty">Nenhum tratamento registrado ainda.</div>`}</div>`;
  }else if(aba==="orc"){
    const os=S.orcamentos.filter(o=>o.pacienteId===p.id).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    const plan=ts.filter(t=>t.status==="planejado");
    corpo=`<div class="card"><div class="bar"><h3 class="grow" style="margin:0">Orçamentos</h3>${plan.length?`<button class="sm" data-act="orc-do-plano">Gerar dos planejados (${plan.length})</button>`:""}<button class="primary sm" data-act="orc-form" data-pac="${p.id}">+ Novo orçamento</button></div>${os.length?orcTabela(os):`<div class="empty">Sem orçamentos.</div>`}</div>`;
  }else if(aba==="img"){corpo=abaImagens(p)}else if(aba==="docs"){corpo=abaDocs(p)}else{
    const ls=S.lancamentos.filter(l=>l.pacienteId===p.id).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    corpo=`<div class="card"><div class="bar"><h3 class="grow" style="margin:0">Pagamentos</h3><button class="primary sm" data-act="lanc-form" data-tipo="entrada" data-pac="${p.id}">+ Lançar</button></div>${ls.length?lancTabela(ls):`<div class="empty">Sem lançamentos para este paciente.</div>`}</div>`;
  }
  return `<div class="bar"><button class="sm" data-act="ir" data-v="pacientes">← Pacientes</button><div class="grow"><h2>${esc(p.nome)}</h2><p class="sub" style="margin:0">${esc(p.tel||"Sem telefone")}${p.nasc?` · nasc. ${fdata(p.nasc)}`:""}</p></div>
<button class="sm" data-act="paciente-form" data-id="${p.id}">Editar</button><button class="primary sm" data-act="consulta-form">Marcar consulta</button></div>
${p.obs?`<p class="card" style="margin-bottom:14px">${esc(p.obs)}</p>`:""}
<div class="tabs">${tab("dentes","Odontograma")}${tab("hist","Histórico")}${tab("orc","Orçamentos")}${tab("pag","Pagamentos")}${tab("img","Imagens")}${tab("docs","Documentos")}</div>${corpo}`}

function tratTabela(ts,mostraDente){return `<div class="tbl"><table><thead><tr><th>Data</th><th>Dente</th><th>Procedimento</th><th>Situação</th><th class="r">Valor</th><th></th></tr></thead><tbody>${ts.map(t=>`<tr><td>${fdata(t.data)}</td><td><b>${esc(t.dente==="geral"?"Geral":t.dente)}</b>${t.faces?` <span class="sub" style="margin:0">(${esc(t.faces)})</span>`:""}</td><td>${esc(t.procedimento)}${t.obs?`<br><span class="sub" style="margin:0">${esc(t.obs)}</span>`:""}</td><td><span class="pill ${t.status==="realizado"?"ok":"warn"}">${t.status==="realizado"?"Realizado":"Planejado"}</span></td><td class="r">${brl(t.valor)}</td><td class="r"><button class="sm" data-act="trat-form" data-id="${t.id}">Editar</button></td></tr>`).join("")}</tbody></table></div>`}

function tratForm(id,dente){const t=S.tratamentos.find(x=>x.id===id)||{dente:dente||S.dente||"geral",data:hoje(),status:"realizado",valor:""};
  modal(`<h3>${id?"Editar procedimento":"Registrar procedimento"} · ${esc(nomePac(S.pacId))}</h3><form id="f" class="form" data-id="${id||""}" data-kind="trat">
<label>Dente<select name="dente">${dOpt(t.dente)}</select></label>
<label>Face(s) (opcional)<input name="faces" value="${esc(t.faces||"")}" placeholder="Ex.: O, MOD, V"></label>
<label class="full">Procedimento<input name="procedimento" value="${esc(t.procedimento||"")}" placeholder="Ex.: Restauração em resina, Canal, Extração" required></label>
<label>Data<input type="date" name="data" value="${t.data}" required></label>
<label>Valor (R$)<input name="valor" inputmode="decimal" value="${t.valor!==""&&t.valor!=null?String(t.valor).replace(".",","):""}" placeholder="0,00"></label>
<label>Situação<select name="status"><option value="realizado" ${t.status==="realizado"?"selected":""}>Realizado</option><option value="planejado" ${t.status==="planejado"?"selected":""}>Planejado</option></select></label>
${id?"":`<label>Cobrança<select name="cobrar"><option value="">Não gerar cobrança</option><option value="pendente">Gerar cobrança pendente</option><option value="pago">Já foi pago</option></select></label>`}
<label class="full">Observações<textarea name="obs" rows="2">${esc(t.obs||"")}</textarea></label>
<div class="full acts"><button class="primary" type="submit">Salvar</button><button type="button" data-act="fechar">Cancelar</button>${id?`<button type="button" class="danger" data-act="del" data-col="tratamentos" data-id="${id}">Excluir</button>`:""}</div></form>`)}

const ORC_ST={pendente:["Pendente","warn"],aprovado:["Aprovado","ok"],recusado:["Recusado","bad"]};
function orcTabela(os){return `<div class="tbl"><table><thead><tr><th>Data</th>${S.view==="orcamentos"?"<th>Paciente</th>":""}<th>Itens</th><th class="r">Total</th><th>Situação</th><th></th></tr></thead><tbody>${os.map(o=>{const p=pac(o.pacienteId);const[t,c]=ORC_ST[o.status]||ORC_ST.pendente;return `<tr><td>${fdata(o.data)}</td>${S.view==="orcamentos"?`<td><b>${esc(p?.nome||"—")}</b></td>`:""}<td>${(o.itens||[]).length}</td><td class="r"><b>${brl(totalOrc(o))}</b></td><td><span class="pill ${c}">${t}</span></td><td class="r"><div class="acts" style="justify-content:flex-end">${btnWa(p?.tel,msgOrc(o),"WhatsApp")}<button class="sm" data-act="orc-form" data-id="${o.id}">Abrir</button></div></td></tr>`}).join("")}</tbody></table></div>`}

function itemRow(i={}){return `<div class="form orc-item" style="grid-template-columns:110px 1fr 130px auto;align-items:end"><label>Dente<select name="i_dente">${dOpt(i.dente||"geral")}</select></label><label>Procedimento<input name="i_desc" value="${esc(i.desc||"")}"></label><label>Valor<input name="i_valor" inputmode="decimal" value="${i.valor!=null&&i.valor!==""?String(i.valor).replace(".",","):""}"></label><button type="button" class="sm danger" data-act="rm-item" aria-label="Remover item">✕</button></div>`}
function orcForm(id,pacId,itens){const o=S.orcamentos.find(x=>x.id===id)||{pacienteId:pacId||S.pacId||"",data:hoje(),status:"pendente",itens:itens||[{}],desconto:"",obs:""};
  if(!S.pacientes.length){toast("Cadastre um paciente primeiro");return}
  modal(`<h3>${id?"Orçamento":"Novo orçamento"}</h3><form id="f" data-id="${id||""}" data-kind="orc" class="stack">
<div class="form"><label>Paciente<select name="pacienteId">${S.pacientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}" ${p.id===o.pacienteId?"selected":""}>${esc(p.nome)}</option>`).join("")}</select></label>
<label>Data<input type="date" name="data" value="${o.data}"></label>
<label>Situação<select name="status">${Object.entries(ORC_ST).map(([k,v])=>`<option value="${k}" ${k===o.status?"selected":""}>${v[0]}</option>`).join("")}</select></label></div>
<div id="itens" class="stack">${o.itens.map(itemRow).join("")}</div>
<div><button type="button" class="sm" data-act="add-item">+ Adicionar item</button></div>
<div class="form"><label>Desconto (R$)<input name="desconto" inputmode="decimal" value="${o.desconto?String(o.desconto).replace(".",","):""}"></label><label>Observações (aparecem na mensagem)<input name="obs" value="${esc(o.obs||"")}" placeholder="Ex.: Parcelamos em até 6x"></label></div>
<div class="acts"><button class="primary" type="submit">Salvar</button>${id?btnWa(pac(o.pacienteId)?.tel,msgOrc(o),"Enviar por WhatsApp"):""}${id?`<button type="button" data-act="orc-parcelar" data-id="${id}">Parcelar / cobrar</button>`:""}<button type="button" data-act="fechar">Fechar</button>${id?`<button type="button" class="danger" data-act="del" data-col="orcamentos" data-id="${id}">Excluir</button>`:""}</div></form>`)}

function vOrcamentos(){const os=S.orcamentos.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  return `<div class="bar"><div class="grow"><h2>Orçamentos</h2><p class="sub" style="margin:0">Monte e envie pelo WhatsApp</p></div><button class="primary" data-act="orc-form">+ Novo orçamento</button></div><div class="card">${os.length?orcTabela(os):`<div class="empty">Nenhum orçamento ainda.</div>`}</div>`}
</script>
<script>
function lancTabela(ls,comPac){return `<div class="tbl"><table><thead><tr><th>Data</th><th>Descrição</th>${comPac?"<th>Paciente</th>":""}<th>Situação</th><th class="r">Valor</th><th></th></tr></thead><tbody>${ls.map(l=>{const p=pac(l.pacienteId),ent=l.tipo==="entrada",pend=l.status==="pendente";
return `<tr><td>${fdata(pend&&l.vencimento?l.vencimento:l.data)}</td><td>${esc(l.desc)}${l.categoria?`<br><span class="sub" style="margin:0">${esc(l.categoria)}</span>`:""}</td>${comPac?`<td>${esc(p?.nome||"—")}</td>`:""}
<td><span class="pill ${pend?"warn":"ok"}">${pend?"Pendente":"Pago"}</span></td><td class="r ${ent?"pos":"neg"}"><b>${ent?"+":"−"} ${brl(l.valor)}</b></td>
<td class="r"><div class="acts" style="justify-content:flex-end">${pend&&ent&&p?btnWa(p.tel,msgCobr(l),"Cobrar"):""}${pend?`<button class="sm" data-act="pagar" data-id="${l.id}">Marcar pago</button>`:""}<button class="sm" data-act="lanc-form" data-id="${l.id}">Editar</button></div></td></tr>`}).join("")}</tbody></table></div>`}

function lancForm(id,tipo,pacId,pre){const l=S.lancamentos.find(x=>x.id===id)||{tipo:tipo||"entrada",data:hoje(),status:"pago",pacienteId:pacId||"",valor:"",...(pre||{})};
  modal(`<h3>${id?"Editar lançamento":"Novo lançamento"}</h3><form id="f" class="form" data-id="${id||""}" data-kind="lanc">
<label>Tipo<select name="tipo"><option value="entrada" ${l.tipo==="entrada"?"selected":""}>Entrada (recebimento)</option><option value="saida" ${l.tipo==="saida"?"selected":""}>Saída (despesa)</option></select></label>
<label>Valor (R$)<input name="valor" inputmode="decimal" required value="${l.valor!==""?String(l.valor).replace(".",","):""}" placeholder="0,00"></label>
<label class="full">Descrição<input name="desc" required value="${esc(l.desc||"")}" placeholder="Ex.: Restauração dente 36, Material, Aluguel"></label>
<label>Situação<select name="status"><option value="pago" ${l.status==="pago"?"selected":""}>Pago / recebido</option><option value="pendente" ${l.status==="pendente"?"selected":""}>Pendente</option></select></label>
<label>Data<input type="date" name="data" value="${l.data}" required></label>
<label>Vencimento (se pendente)<input type="date" name="vencimento" value="${l.vencimento||""}"></label>
<label>Forma de pagamento<select name="forma">${["","Pix","Dinheiro","Cartão de débito","Cartão de crédito","Boleto","Transferência"].map(f=>`<option ${f===l.forma?"selected":""}>${f}</option>`).join("")}</select></label>
<label>Categoria<input name="categoria" value="${esc(l.categoria||"")}" placeholder="Ex.: Materiais, Laboratório, Aluguel"></label>
${id?"":`<label>Parcelas<input type="number" name="parcelas" min="1" max="60" value="${l.parcelas||1}"><span style="font-weight:500">Acima de 1: cria uma cobrança pendente por mês, a partir do vencimento.</span></label>`}
<label>Paciente (opcional)<select name="pacienteId"><option value="">—</option>${S.pacientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}" ${p.id===l.pacienteId?"selected":""}>${esc(p.nome)}</option>`).join("")}</select></label>
<div class="full acts"><button class="primary" type="submit">Salvar</button><button type="button" data-act="fechar">Cancelar</button>${id?`<button type="button" class="danger" data-act="del" data-col="lancamentos" data-id="${id}">Excluir</button>`:""}</div></form>`)}

function vFinanceiro(){const m=S.mes;const doMes=S.lancamentos.filter(l=>(l.data||"").startsWith(m)||(l.status==="pendente"&&(l.vencimento||"").startsWith(m)));
  const ent=somaMes("entrada",m),sai=somaMes("saida",m),pend=pendentes();
  const ls=doMes.sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  return `<div class="bar"><div class="grow"><h2>Financeiro</h2><p class="sub" style="margin:0">Entradas, saídas e cobranças</p></div>
<input type="month" id="mesSel" value="${m}" style="width:auto"><button class="primary" data-act="lanc-form" data-tipo="entrada">+ Entrada</button><button data-act="lanc-form" data-tipo="saida">+ Saída</button></div>
<div class="grid" style="margin-bottom:16px"><div class="card kpi"><div class="l">Entradas</div><div class="n pos">${brl(ent)}</div></div><div class="card kpi"><div class="l">Saídas</div><div class="n neg">${brl(sai)}</div></div>
<div class="card kpi"><div class="l">Saldo do mês</div><div class="n ${ent-sai<0?"neg":""}">${brl(ent-sai)}</div></div><div class="card kpi"><div class="l">A receber (total)</div><div class="n">${brl(pend.reduce((s,l)=>s+(+l.valor||0),0))}</div></div></div>
${pend.length?`<div class="card" style="margin-bottom:16px"><h3>Cobranças em aberto</h3>${lancTabela(pend.sort((a,b)=>(a.vencimento||"9").localeCompare(b.vencimento||"9")),true)}</div>`:""}
<div class="card"><h3>Movimentação do mês</h3>${ls.length?lancTabela(ls,true):`<div class="empty">Nenhum lançamento neste mês.</div>`}</div>`}

const VIEWS={relatorio:()=>vRelatorio(),config:()=>vConfig(),inicio:vInicio,agenda:vAgenda,pacientes:vPacientes,paciente:vPaciente,orcamentos:vOrcamentos,financeiro:vFinanceiro};
const num=v=>{const n=parseFloat(String(v||"0").replace(/\./g,"").replace(",","."));return isNaN(n)?0:n};
const fd=f=>Object.fromEntries(new FormData(f).entries());

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,d=b.dataset;
  if(a==="fechar-bg"){if(e.target===b)modal("");return}
  if(a==="fechar"){modal("");return}
  if(a==="ir"){S.view=d.v;S.pacId=null;render();window.scrollTo(0,0)}
  else if(a==="dia"){S.dia=d.d;render()}
  else if(a==="abrir-pac"){S.pacId=d.id;S.view="paciente";S.aba="dentes";S.dente=null;render();window.scrollTo(0,0)}
  else if(a==="aba"){S.aba=d.k;render()}
  else if(a==="dente"){S.dente=String(S.dente)===d.d?null:d.d;render()}
  else if(a==="consulta-form")consultaForm(d.id,d.data);
  else if(a==="paciente-form")pacienteForm(d.id);
  else if(a==="trat-form")tratForm(d.id,d.dente);
  else if(a==="orc-form")orcForm(d.id,d.pac);
  else if(a==="lanc-form")lancForm(d.id,d.tipo,d.pac);
  else if(a==="add-item"){$("#itens").insertAdjacentHTML("beforeend",itemRow())}
  else if(a==="rm-item"){const it=b.closest(".orc-item");if(document.querySelectorAll(".orc-item").length>1)it.remove();else it.querySelectorAll("input").forEach(i=>i.value="")}
  else if(a==="orc-do-plano"){const itens=S.tratamentos.filter(t=>t.pacienteId===S.pacId&&t.status==="planejado").map(t=>({dente:t.dente,desc:t.procedimento,valor:t.valor||0}));orcForm(null,S.pacId,itens)}
  else if(a==="pagar"){const l=S.lancamentos.find(x=>x.id===d.id);if(l){const{id,...r}=l;await salvar("lancamentos",d.id,{...r,status:"pago",data:hoje()});toast("Marcado como pago")}}
  else if(a==="del"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Toque de novo para excluir";return}
    await remover(d.col,d.id);modal("");toast("Excluído")}
});
document.addEventListener("input",e=>{if(e.target.id==="busca"){S.busca=e.target.value;const pos=e.target.selectionStart;render();const i=$("#busca");i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{if(e.target.id==="diaSel"&&e.target.value){S.dia=e.target.value;render()}if(e.target.id==="mesSel"&&e.target.value){S.mes=e.target.value;render()}});

document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,k=f.dataset.kind,id=f.dataset.id||null,v=fd(f);let ok=null;
  if(k==="paciente"){ok=await salvar("pacientes",id,{nome:v.nome.trim(),tel:v.tel.trim(),nasc:v.nasc,obs:v.obs.trim()});if(ok&&!id&&S.view==="pacientes"){}}
  else if(k==="consulta"){ok=await salvar("consultas",id,{pacienteId:v.pacienteId,data:v.data,hora:v.hora,duracao:+v.duracao||30,status:v.status,procedimento:v.procedimento.trim()})}
  else if(k==="trat"){const valor=num(v.valor);ok=await salvar("tratamentos",id,{pacienteId:S.pacId,dente:v.dente,faces:v.faces.trim(),procedimento:v.procedimento.trim(),data:v.data,valor,status:v.status,obs:v.obs.trim()});
    if(ok&&!id&&v.cobrar&&valor>0)await salvar("lancamentos",null,{tipo:"entrada",desc:`${v.procedimento.trim()}${v.dente!=="geral"?` (dente ${v.dente})`:""}`,valor,data:v.data,status:v.cobrar,pacienteId:S.pacId,categoria:"Tratamento"})}
  else if(k==="orc"){const itens=[...f.querySelectorAll(".orc-item")].map(r=>({dente:r.querySelector("[name=i_dente]").value,desc:r.querySelector("[name=i_desc]").value.trim(),valor:num(r.querySelector("[name=i_valor]").value)})).filter(i=>i.desc);
    if(!itens.length){toast("Inclua ao menos um item");return}
    ok=await salvar("orcamentos",id,{pacienteId:v.pacienteId,data:v.data,status:v.status,itens,desconto:num(v.desconto),obs:v.obs.trim()})}
  else if(k==="lanc"){const base={tipo:v.tipo,desc:v.desc.trim(),forma:v.forma,categoria:v.categoria.trim(),pacienteId:v.pacienteId};const n=Math.min(60,Math.max(1,parseInt(v.parcelas)||1));
    if(!id&&n>1)ok=await parcelar({...base,valor:num(v.valor),n,primeiro:v.vencimento||v.data});else ok=await salvar("lancamentos",id,{...base,valor:num(v.valor),status:v.status,data:v.data,vencimento:v.vencimento})}
  if(ok){modal("");toast("Salvo")}
});

</script>

<script>
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const dataLonga=s=>{const[a,m,d]=s.split("-");return `${+d} de ${MESES[+m-1]} de ${a}`};
const mesRot=m=>{const r=`${MESES[+m.slice(5)-1]} de ${m.slice(0,4)}`;return r[0].toUpperCase()+r.slice(1)};
function addMes(s,n){const[a,m,d]=s.split("-").map(Number);const ult=new Date(a,m+n,0).getDate();const t=new Date(a,m-1+n,1);return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(Math.min(d,ult))}`}
function baixar(nome,conteudo,tipo){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* Parcelamento: uma cobrança pendente por mês; os centavos que sobram vão na primeira parcela */
async function parcelar({valor,n,primeiro,desc,tipo,pacienteId,categoria,forma}){
  const cent=Math.round(valor*100),base=Math.floor(cent/n),resto=cent-base*n;let ult=null;
  for(let i=0;i<n;i++){const venc=addMes(primeiro,i);
    ult=await salvar("lancamentos",null,{tipo,desc:`${desc} (${i+1}/${n})`,valor:(base+(i===0?resto:0))/100,status:"pendente",data:venc,vencimento:venc,forma,categoria,pacienteId,parcela:`${i+1}/${n}`});
    if(!ult)return null}
  return ult}

/* Ajustes e backup */
function vConfig(){const c=cfg();let ub="";try{ub=localStorage.getItem("ultimo_backup")||""}catch(e){}
  return `<h2>Ajustes</h2><p class="sub">Dados da clínica (aparecem em receitas, atestados e relatórios) e cópia de segurança.</p>
<div class="card" style="margin-bottom:16px"><form id="f" class="form" data-kind="cfg">
<label class="full">Nome da clínica<input name="nome" value="${esc(c.nome||"")}"></label>
<label>Dentista responsável<input name="dentista" value="${esc(c.dentista||"")}"></label><label>CRO<input name="cro" value="${esc(c.cro||"")}" placeholder="Ex.: RJ-12345"></label>
<label class="full">Endereço<input name="endereco" value="${esc(c.endereco||"")}"></label>
<label>Telefone<input name="tel" value="${esc(c.tel||"")}"></label><label>Cidade (para a data nos documentos)<input name="cidade" value="${esc(c.cidade||"")}" placeholder="Barra Mansa"></label>
<div class="full"><button class="primary" type="submit">Salvar dados</button></div></form></div>
<div class="card"><h3>Cópia de segurança</h3>
<p>Os dados ficam guardados <b>somente neste aparelho</b>. Se o navegador for limpo ou o tablet trocado, eles se perdem. Faça a cópia com frequência e guarde o arquivo em outro lugar (pen drive, computador, e-mail).</p>
<p class="sub">${ub?`Última cópia: ${new Date(+ub).toLocaleString("pt-BR")}`:"Nenhuma cópia feita ainda."}</p>
<div class="acts"><button class="primary" data-act="backup">Salvar cópia de segurança</button><button data-act="pedir-restaurar">Restaurar de um arquivo</button></div>
<input type="file" id="arqBackup" accept=".json,application/json" hidden></div>`}

function relDados(m){const soma=a=>a.reduce((s,l)=>s+(+l.valor||0),0);
  const pagos=S.lancamentos.filter(l=>l.status==="pago"&&(l.data||"").startsWith(m)).sort((a,b)=>a.data.localeCompare(b.data));
  const ent=pagos.filter(l=>l.tipo==="entrada"),sai=pagos.filter(l=>l.tipo==="saida");
  const abertos=S.lancamentos.filter(l=>l.status==="pendente"&&(l.vencimento||l.data||"")<=m+"-31").sort((a,b)=>(a.vencimento||a.data).localeCompare(b.vencimento||b.data));
  const prod=S.tratamentos.filter(t=>t.status==="realizado"&&(t.data||"").startsWith(m));
  const agr=(a,f,vazio)=>{const o={};a.forEach(l=>{const k=l[f]||vazio;o[k]=(o[k]||0)+(+l.valor||0)});return Object.entries(o).sort((x,y)=>y[1]-x[1])};
  return{pagos,ent,sai,abertos,prod,te:soma(ent),ts:soma(sai),tp:soma(prod),ta:soma(abertos)}}
const rTab=(cab,linhas,dir=[])=>linhas.length?`<div class="tbl"><table><thead><tr>${cab.map((c,i)=>`<th class="${dir.includes(i)?"r":""}">${c}</th>`).join("")}</tr></thead><tbody>${linhas.map(r=>`<tr>${r.map((c,i)=>`<td class="${dir.includes(i)?"r":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<p class="sub">Nada neste período.</p>`;
function relHtml(m){const d=relDados(m),c=cfg();
  const agr=(a,f,v)=>{const o={};a.forEach(l=>{const k=l[f]||v;o[k]=(o[k]||0)+(+l.valor||0)});return Object.entries(o).sort((x,y)=>y[1]-x[1]).map(([k,x])=>[esc(k),brl(x)])};
  return `<div class="rel"><h2>Relatório financeiro · ${mesRot(m)}</h2><p class="sub">${esc([c.nome,c.dentista,c.cro&&"CRO "+c.cro].filter(Boolean).join(" · "))}</p>
${rTab(["Resumo","Valor"],[["Total de entradas (recebido)",brl(d.te)],["Total de saídas (pago)",brl(d.ts)],["<b>Resultado do mês</b>",`<b>${brl(d.te-d.ts)}</b>`],["Produção (procedimentos realizados)",brl(d.tp)],["A receber em aberto até o fim do mês",brl(d.ta)]],[1])}
<h3>Entradas por forma de pagamento</h3>${rTab(["Forma","Valor"],agr(d.ent,"forma","Não informada"),[1])}
<h3>Entradas por categoria</h3>${rTab(["Categoria","Valor"],agr(d.ent,"categoria","Sem categoria"),[1])}
<h3>Saídas por categoria</h3>${rTab(["Categoria","Valor"],agr(d.sai,"categoria","Sem categoria"),[1])}
<h3>Movimentação detalhada</h3>${rTab(["Data","Tipo","Descrição","Paciente","Forma","Valor"],d.pagos.map(l=>[fdata(l.data),l.tipo==="entrada"?"Entrada":"Saída",esc(l.desc),esc(l.pacienteId?nomePac(l.pacienteId):"—"),esc(l.forma||"—"),`<span class="${l.tipo==="entrada"?"pos":"neg"}">${l.tipo==="entrada"?"":"−"}${brl(l.valor)}</span>`]),[5])}
<h3>Em aberto (vencimento até o fim do mês)</h3>${rTab(["Vencimento","Tipo","Descrição","Paciente","Valor"],d.abertos.map(l=>[fdata(l.vencimento||l.data),l.tipo==="entrada"?"A receber":"A pagar",esc(l.desc),esc(l.pacienteId?nomePac(l.pacienteId):"—"),brl(l.valor)]),[4])}</div>`}
function vRelatorio(){
  const ps=S.pacientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const ds=S.documentos.filter(d=>(d.data||"").startsWith(S.mes)).sort((a,b)=>b.data.localeCompare(a.data));
  const emitir=ps.length?`<div class="form"><label>Paciente<select id="docPac">${ps.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join("")}</select></label><label>Documento<select id="docTipo"><option value="atestado">Atestado odontológico</option><option value="comparecimento">Declaração de comparecimento</option><option value="receita">Receita</option></select></label><div style="align-self:end"><button class="primary" data-act="doc-novo">Criar documento</button></div></div>`:`<div class="empty">Cadastre um paciente para emitir documentos.</div>`;
  const lista=ds.length?`<div class="tbl"><table><thead><tr><th>Data</th><th>Paciente</th><th>Documento</th><th></th></tr></thead><tbody>${ds.map(d=>`<tr><td>${fdata(d.data)}</td><td>${esc(nomePac(d.pacienteId))}</td><td>${esc(TIPO_ROT[d.tipo]||"Documento")}</td><td class="r"><button class="sm" data-act="doc-ver" data-id="${d.id}">Ver / imprimir</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="sub">Nenhum documento emitido em ${mesRot(S.mes)}.</p>`;
  return `<div class="bar"><div class="grow"><h2 style="margin:0">Relatórios</h2><p class="sub" style="margin:0">Atestados, documentos e relatório para o contador</p></div><input type="month" id="relMes" value="${S.mes}" style="width:auto"></div>
<div class="card" style="margin-bottom:16px"><h3>Emitir atestado ou documento</h3>${emitir}<h3 style="margin-top:18px">Documentos emitidos em ${mesRot(S.mes)}</h3>${lista}</div>
<div class="card"><div class="bar"><h3 class="grow" style="margin:0">Relatório financeiro</h3><button class="primary sm" data-act="rel-print">Imprimir / salvar PDF</button><button class="sm" data-act="rel-csv">Baixar planilha (CSV)</button></div>${relHtml(S.mes)}</div>`}
function relCsv(m){const d=relDados(m),q=v=>`"${String(v??"").replace(/"/g,'""')}"`,n=v=>String(Number(v||0).toFixed(2)).replace(".",",");
  const L=[["Data","Tipo","Descrição","Paciente","Categoria","Forma","Situação","Valor"].map(q).join(";")];
  d.pagos.concat(d.abertos).forEach(l=>L.push([fdata(l.status==="pago"?l.data:(l.vencimento||l.data)),l.tipo==="entrada"?"Entrada":"Saída",l.desc,l.pacienteId?nomePac(l.pacienteId):"",l.categoria||"",l.forma||"",l.status==="pago"?"Pago":"Em aberto",n(l.tipo==="entrada"?l.valor:-l.valor)].map(q).join(";")));
  return "﻿"+L.join("\r\n")}
</script>
<script>
/* Receituário, atestado e declaração */
const TIT={receita:"RECEITUÁRIO",atestado:"ATESTADO ODONTOLÓGICO",comparecimento:"DECLARAÇÃO DE COMPARECIMENTO",outro:"DOCUMENTO"};
const TIPO_ROT={receita:"Receita",atestado:"Atestado",comparecimento:"Declaração de comparecimento",outro:"Outro"};
function tplDoc(tipo,dias,data){const n=pac(S.pacId)?.nome||"____________";
  if(tipo==="atestado")return `Atesto, para os devidos fins, que o(a) paciente ${n} esteve sob meus cuidados odontológicos em ${dataLonga(data)}, necessitando de afastamento de suas atividades por ${dias||1} dia(s) a partir desta data.`;
  if(tipo==="comparecimento")return `Declaro, para os devidos fins, que ${n} compareceu a este consultório em ${dataLonga(data)}, no período das ____ às ____, para atendimento odontológico.`;
  if(tipo==="receita")return `Uso oral\n\n1) ______________________________  ______ \n    Tomar ___ comprimido(s) de ___ em ___ horas, por ___ dias.\n\n2) ______________________________  ______ \n    ____________________________________________`;
  return ""}
function docHtml(d){const c=cfg(),p=pac(d.pacienteId);
  return `<div style="text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:22px"><div style="font:700 20px Georgia,serif">${esc(c.nome||"Clínica odontológica")}</div><div style="font-size:13px">${esc([c.dentista,c.cro&&"CRO "+c.cro].filter(Boolean).join(" · "))}</div><div style="font-size:12px">${esc([c.endereco,c.tel].filter(Boolean).join(" · "))}</div></div>
<div style="text-align:center;font:700 17px Georgia,serif;letter-spacing:.08em;margin-bottom:18px">${TIT[d.tipo]||"DOCUMENTO"}</div>
<div style="margin-bottom:16px">Paciente: <b>${esc(p?.nome)}</b></div>
<div style="white-space:pre-wrap;font-size:16px;line-height:1.7;min-height:240px">${esc(d.texto)}</div>
<div style="margin-top:34px;text-align:right">${esc(c.cidade?c.cidade+", ":"")}${dataLonga(d.data)}</div>
<div style="margin:54px auto 0;width:300px;border-top:1px solid #000;text-align:center;padding-top:4px;font-size:14px">${esc(c.dentista||"Cirurgião-dentista")}${c.cro?`<br>CRO ${esc(c.cro)}`:""}</div>`}
function abaDocs(p){const ds=S.documentos.filter(d=>d.pacienteId===p.id).sort((a,b)=>b.data.localeCompare(a.data));
  return `<div class="card"><div class="bar"><h3 class="grow" style="margin:0">Receitas e atestados</h3><button class="primary sm" data-act="doc-form" data-tipo="receita">+ Receita</button><button class="primary sm" data-act="doc-form" data-tipo="atestado">+ Atestado</button><button class="sm" data-act="doc-form" data-tipo="comparecimento">+ Declaração</button></div>
${ds.length?`<div class="tbl"><table><thead><tr><th>Data</th><th>Documento</th><th></th></tr></thead><tbody>${ds.map(d=>`<tr><td>${fdata(d.data)}</td><td>${TIPO_ROT[d.tipo]||"Documento"}</td><td class="r"><button class="sm" data-act="doc-ver" data-id="${d.id}">Ver / imprimir</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhum documento emitido.</div>`}</div>`}
function docForm(id,tipo){const d=S.documentos.find(x=>x.id===id)||{tipo:tipo||"receita",data:hoje(),dias:1,texto:tplDoc(tipo||"receita",1,hoje())};
  modal(`<h3>${id?"Editar documento":"Novo documento"} · ${esc(nomePac(S.pacId))}</h3><form id="f" class="form" data-kind="doc" data-id="${id||""}">
<label>Tipo<select name="tipo">${Object.entries(TIPO_ROT).map(([k,v])=>`<option value="${k}" ${k===d.tipo?"selected":""}>${v}</option>`).join("")}</select></label>
<label>Data<input type="date" name="data" value="${d.data}" required></label>
<label>Dias de afastamento (atestado)<input type="number" name="dias" min="1" value="${d.dias||1}"></label>
<label class="full">Texto<textarea name="texto" rows="9" data-auto="${id?0:1}">${esc(d.texto)}</textarea></label>
<div class="full acts"><button class="primary" type="submit">Salvar e visualizar</button><button type="button" data-act="fechar">Cancelar</button>${id?`<button type="button" class="danger" data-act="del" data-col="documentos" data-id="${id}">Excluir</button>`:""}</div></form>`)}
function docVer(id){const d=S.documentos.find(x=>x.id===id);if(!d)return;
  modal(`<div class="docprev">${docHtml(d)}</div><div class="acts"><button class="primary" data-act="imprimir" data-id="${id}">Imprimir</button><button data-act="doc-form" data-id="${id}">Editar</button><button data-act="fechar">Fechar</button></div>`)}

/* Fotos e radiografias */
function reduzir(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(file)})}
const IMG_TIPOS=["Radiografia periapical","Radiografia panorâmica","Radiografia interproximal","Foto intraoral","Foto do rosto","Outro"];
function abaImagens(p){const is=S.imagens.filter(i=>i.pacienteId===p.id).sort((a,b)=>b.data.localeCompare(a.data));
  return `<div class="card"><div class="bar"><h3 class="grow" style="margin:0">Fotos e radiografias</h3><button class="primary sm" data-act="img-form">+ Adicionar imagens</button></div>
${is.length?`<div class="thumbs">${is.map(i=>`<button class="thumb" data-act="img-ver" data-id="${i.id}"><img src="${i.thumb}" alt="${esc(i.tipo)}"><span><b>${esc(i.tipo)}</b><br>${i.dente&&i.dente!=="geral"?`Dente ${esc(i.dente)} · `:""}${fdata(i.data)}</span></button>`).join("")}</div>`:`<div class="empty">Nenhuma imagem. Toque em "Adicionar imagens" para tirar uma foto ou escolher arquivos (JPG ou PNG).</div>`}</div>`}
function imgForm(){modal(`<h3>Adicionar imagens · ${esc(nomePac(S.pacId))}</h3><form id="f" class="form" data-kind="img">
<label class="full">Fotos ou radiografias<input type="file" id="arq" name="arq" accept="image/*" multiple required></label>
<label>Tipo<select name="tipo">${IMG_TIPOS.map(t=>`<option>${t}</option>`).join("")}</select></label><label>Dente<select name="dente">${dOpt(S.dente||"geral")}</select></label>
<label>Data<input type="date" name="data" value="${hoje()}"></label><label>Legenda (opcional)<input name="legenda"></label>
<div class="full acts"><button class="primary" type="submit" id="btnImg">Salvar</button><button type="button" data-act="fechar">Cancelar</button></div></form>`)}
async function imgVer(id){const i=S.imagens.find(x=>x.id===id);if(!i)return;
  modal(`<div class="viewer"><img id="vimg" src="${i.thumb}" alt="${esc(i.tipo)}"><p><b>${esc(i.tipo)}</b>${i.dente&&i.dente!=="geral"?` · Dente ${esc(i.dente)}`:""} · ${fdata(i.data)}${i.legenda?`<br>${esc(i.legenda)}`:""}</p><div class="acts"><button data-act="fechar">Fechar</button><button class="danger" data-act="del" data-col="imagens" data-id="${id}">Excluir</button></div></div>`);
  try{const full=await db.blobGet(id);const el=$("#vimg");if(full&&el)el.src=full}catch(e){}}

/* Eventos dos novos recursos */
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,d=b.dataset;
  if((a==="doc-form"||a==="doc-ver")&&d.id){const x=S.documentos.find(z=>z.id===d.id);if(x)S.pacId=x.pacienteId}
  if(a==="doc-form")docForm(d.id,d.tipo);else if(a==="doc-ver")docVer(d.id);
  else if(a==="doc-novo"){const pid=$("#docPac")&&$("#docPac").value;if(!pid){toast("Escolha o paciente");return}S.pacId=pid;docForm(null,$("#docTipo").value)}
  else if(a==="imprimir"){const x=S.documentos.find(z=>z.id===d.id);$("#print").innerHTML=docHtml(x);window.print()}
  else if(a==="img-form")imgForm();else if(a==="img-ver")imgVer(d.id);
  else if(a==="orc-parcelar"){const o=S.orcamentos.find(x=>x.id===d.id);if(o)lancForm(null,"entrada",o.pacienteId,{valor:totalOrc(o),desc:`Tratamento (orçamento de ${fdata(o.data)})`,status:"pendente",categoria:"Tratamento",parcelas:3,vencimento:addDias(hoje(),30)})}
  else if(a==="rel-print"){$("#print").innerHTML=relHtml(S.mes);window.print()}
  else if(a==="rel-csv"){baixar(`relatorio-${S.mes}.csv`,relCsv(S.mes),"text/csv;charset=utf-8");toast("Planilha gerada")}
  else if(a==="backup"){try{const o=await db.exportar();baixar(`backup-clinica-${hoje()}.json`,JSON.stringify(o),"application/json");try{localStorage.setItem("ultimo_backup",String(Date.now()))}catch(x){}toast("Cópia salva na pasta de downloads");render()}catch(x){toast("Não foi possível gerar a cópia")}}
  else if(a==="pedir-restaurar"){$("#arqBackup").click()}
  else if(a==="confirmar-restaurar"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Toque de novo para substituir tudo";return}
    await db.importar(window.__bk);window.__bk=null;modal("");toast("Dados restaurados")}
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="relMes"&&t.value){S.mes=t.value;render()}
  if(t.id==="arqBackup"&&t.files[0]){try{const o=JSON.parse(await t.files[0].text());if(o.app!=="clinica-controle"||!o.data)throw 0;window.__bk=o;t.value="";
    modal(`<h3>Restaurar cópia de segurança</h3><p>Arquivo de ${o.gerado?new Date(o.gerado).toLocaleString("pt-BR"):"data desconhecida"} com ${(o.data.pacientes||[]).length} paciente(s). Isso <b>substitui todos os dados atuais</b> deste aparelho.</p><div class="acts"><button class="danger" data-act="confirmar-restaurar">Substituir dados</button><button data-act="fechar">Cancelar</button></div>`)}catch(x){toast("Arquivo de cópia inválido")}}
  const f=t.form;if(f&&f.dataset.kind==="doc"&&(t.name==="tipo"||t.name==="dias"||t.name==="data")){const ta=f.elements.texto;if(ta.dataset.auto==="1")ta.value=tplDoc(f.elements.tipo.value,f.elements.dias.value,f.elements.data.value||hoje())}
});
document.addEventListener("input",e=>{if(e.target.name==="texto"&&e.target.form?.dataset.kind==="doc")e.target.dataset.auto="0"});
document.addEventListener("submit",async e=>{const f=e.target,k=f.dataset.kind;if(!["cfg","doc","img"].includes(k))return;e.preventDefault();const v=fd(f);
  if(k==="cfg"){const r=await salvar("config","clinica",{nome:v.nome.trim(),dentista:v.dentista.trim(),cro:v.cro.trim(),endereco:v.endereco.trim(),tel:v.tel.trim(),cidade:v.cidade.trim()});if(r)toast("Dados salvos")}
  else if(k==="doc"){const id=f.dataset.id||null;const dono=id?(S.documentos.find(x=>x.id===id)||{}).pacienteId:null;const r=await salvar("documentos",id,{pacienteId:dono||S.pacId,tipo:v.tipo,data:v.data,dias:+v.dias||1,texto:v.texto});if(r)docVer(r)}
  else if(k==="img"){const files=[...f.elements.arq.files];if(!files.length)return;const btn=$("#btnImg");btn.disabled=true;let n=0;
    try{for(const file of files){btn.textContent=`Salvando ${++n} de ${files.length}…`;const thumb=await reduzir(file,360,.72),full=await reduzir(file,1800,.85),id=novoId();
      await db.blobPut(id,full);await salvar("imagens",id,{pacienteId:S.pacId,tipo:v.tipo,dente:v.dente,data:v.data||hoje(),legenda:v.legenda.trim(),thumb})}
      modal("");toast(files.length>1?"Imagens salvas":"Imagem salva")}catch(x){toast("Não foi possível ler uma das imagens");btn.disabled=false;btn.textContent="Salvar"}}
});
VIEWS.inicio=(()=>{const base=vInicio;return()=>{let u=0;try{u=+localStorage.getItem("ultimo_backup")||0}catch(e){}
  const aviso=(Date.now()-u>7*864e5)?`<div class="aviso">${u?"Faz mais de 7 dias desde a última cópia de segurança.":"Você ainda não fez cópia de segurança dos dados."}<button class="sm" data-act="backup">Fazer cópia agora</button></div>`:"";return aviso+base()}})();
</script>

  COLS_CACHE.forEach(ouvir);
